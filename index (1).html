<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDER FOOTWEAR — Wholesale Order System</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1B1712; --ink2:#4C443A; --mut:#8B8175;
  --paper:#F4F0E7; --card:#FDFCF8;
  --line:#E3DDCF; --lineS:#CFC7B4;
  --acc:#C14A17; --accD:#9C3A0F;
  --grn:#2F6B3F; --red:#A93226; --amb:#9A6A12;
  --fd:'Bricolage Grotesque',sans-serif; --fb:'Archivo',sans-serif; --fm:'Spline Sans Mono',monospace;
}
html{font-size:14px}
body{font-family:var(--fb);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:var(--fb);cursor:pointer}
::selection{background:var(--acc);color:#fff}
.scr{overflow:auto}
.ic{flex:none;display:inline-block;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--fb);padding:10px 16px;border:1px solid var(--ink);background:var(--ink);color:#F6F2E9;border-radius:2px;transition:background .15s,transform .12s,border-color .15s}
.btn:hover{background:#000}
.btn:active{transform:scale(.98)}
.btn.acc{background:var(--acc);border-color:var(--acc)}
.btn.acc:hover{background:var(--accD);border-color:var(--accD)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--lineS)}
.btn.ghost:hover{border-color:var(--ink);background:#fff}
.btn.danger{background:transparent;color:var(--red);border-color:#DCA49C}
.btn.danger:hover{background:#F7E4E1}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.4;pointer-events:none}
.iconbtn{width:32px;height:32px;border:1px solid var(--lineS);background:#fff;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn:hover{border-color:var(--ink);color:var(--ink)}
.chip{display:inline-flex;align-items:center;font:700 10px var(--fb);padding:4px 9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid;border-radius:2px;white-space:nowrap}
.chip.pending{color:var(--amb);border-color:#D9B36A;background:#F7EDD6}
.chip.confirmed{color:var(--grn);border-color:#9DBFA5;background:#E4EFE4}
.chip.cancelled{color:var(--red);border-color:#DCA49C;background:#F7E4E1}
.kick{font:700 10.5px var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
s{color:var(--mut);font-weight:400}
.field{margin-bottom:14px}
.field label{display:block;font:700 10px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--lineS);background:#FFFEFA;font:500 14px var(--fb);color:var(--ink);border-radius:2px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(27,23,18,.08)}
.field .err{display:none;color:var(--red);font-size:11.5px;margin-top:5px;font-weight:600}
.field.bad input{border-color:var(--red)}
.field.bad .err{display:block}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
table{width:100%;border-collapse:collapse}
th{font:700 10px var(--fb);letter-spacing:.13em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--ink)}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F1ECDF}
td.num,th.num{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
.rowlow{box-shadow:inset 3px 0 0 var(--amb)}
.rowout{box-shadow:inset 3px 0 0 var(--red)}
.home{min-height:100vh;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;background-position:center top}
.home-in{max-width:1220px;margin:0 auto;padding:26px 36px 60px}
.home-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap;gap:10px}
.brandmark{display:flex;align-items:center;gap:12px}
.brandmark .bm{color:var(--acc)}
.brandmark .bn{font:800 19px var(--fd);letter-spacing:.04em}
.brandmark .bs{display:block;font:700 8.5px var(--fb);letter-spacing:.3em;color:var(--mut)}
.home-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;padding-top:54px;align-items:start}
.home h1{font:800 clamp(40px,4.6vw,62px)/1.02 var(--fd);letter-spacing:-.015em;margin:18px 0 20px}
.home h1 em{font-style:normal;color:var(--acc)}
.lede{font-size:15.5px;line-height:1.65;color:var(--ink2);max-width:52ch;margin-bottom:34px}
.doors{display:flex;flex-direction:column;gap:12px;max-width:520px}
.door{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:20px 22px;border-radius:3px;transition:transform .16s,background .16s}
.door .dk{display:block;font:700 9.5px var(--fb);letter-spacing:.22em;color:var(--mut);margin-bottom:7px}
.door .dt{display:block;font:800 22px var(--fd)}
.door .ds{display:block;font:500 12.5px var(--fb);margin-top:6px;opacity:.75}
.door-ink{background:var(--ink);color:#F5F0E5;border:1px solid var(--ink)}
.door-ink .dk{color:#9B917F}
.door-ink:hover{transform:translateY(-2px);background:#241E15}
.door-line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.door-line:hover{transform:translateY(-2px);background:#fff}
.door .arw{color:var(--acc)}
.door:hover .arw{transform:translateX(5px)}
.home-stats{margin-top:34px;padding-top:16px;border-top:1px solid var(--lineS);font:600 12px var(--fm);letter-spacing:.05em;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap}
.home-stats b{color:var(--acc)}
.home-foot{margin-top:46px;text-align:center}
.home-foot button{background:none;border:0;color:var(--mut);font:600 11px var(--fb);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px dotted var(--mut);padding:2px 0}
.home-foot button:hover{color:var(--acc);border-color:var(--acc)}
.sheet{position:relative;background:var(--card);border:1.5px solid var(--ink);border-radius:3px;transform:rotate(.5deg);box-shadow:6px 6px 0 rgba(27,23,18,.12)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1.5px solid var(--ink)}
.sheet-h .t{font:800 14px var(--fd)}
.sheet-h .d{font:600 10px var(--fm);color:var(--mut)}
.spec{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.spec:last-child{border-bottom:0}
.spec .sa{border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.spec .sa img{width:100%;height:56px;object-fit:contain;display:block}
.spec .sn{font:700 15px var(--fd)}
.spec .sm2{font:500 11px var(--fm);color:var(--mut);margin-top:3px;letter-spacing:.04em}
.spec .sp{font:700 15px var(--fm);text-align:right}
.spec .sp s{display:block;font-size:11px}
.hstamp{position:absolute;top:-34px;right:-20px;transform:rotate(-11deg);color:var(--acc);opacity:.92;pointer-events:none}
.syncdot{width:9px;height:9px;border-radius:50%;background:#A79E8E;display:inline-block;flex:none}
.syncdot.on{background:#4CAF6D}
.syncdot.off{background:var(--amb)}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.cloudwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.cloudcard{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 rgba(27,23,18,.1);padding:30px 32px;width:min(680px,96vw)}
.crow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--lineS)}
.crow .cl{width:150px;flex:none;color:var(--mut);font:700 10px var(--fb);letter-spacing:.12em;text-transform:uppercase}
.crow .cv{flex:1;font:600 13px var(--fb);word-break:break-all}
.rulesbox{background:#FAF6EC;border:1px solid var(--lineS);border-radius:3px;padding:12px 14px;font:600 12px var(--fm);white-space:pre;overflow:auto;margin:12px 0 8px;color:var(--ink)}
.gatecard{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 rgba(27,23,18,.1);padding:38px 36px;width:min(420px,94vw);text-align:center}
.gatecard .gl{font:700 10px var(--fb);letter-spacing:.3em;color:var(--mut);text-transform:uppercase}
.gatecard .gt{font:800 26px var(--fd);margin:8px 0 12px}
.pw-wrap{display:flex;gap:8px;margin-top:16px}
.pw-wrap input{flex:1;padding:12px;border:1px solid var(--lineS);background:#FFFEFA;font:500 15px var(--fb);border-radius:2px;outline:0;min-width:0}
.gerr{color:var(--red);font:600 12px var(--fb);min-height:18px;margin-top:8px}
.gatecard.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ghint{font:500 11px var(--fb);color:var(--mut);margin-top:16px;border-top:1px dashed var(--lineS);padding-top:12px;line-height:1.6}
.tbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.tbar .sp{flex:1}
.tsel{display:flex;align-items:center;gap:8px;font:600 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.tsel select{padding:7px 9px;border:1px solid var(--lineS);background:#fff;border-radius:2px;font:600 12.5px var(--fb)}
.steps{display:flex;align-items:center;padding:16px 24px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:9px;background:none;border:0;font:600 12px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:4px 2px}
.stp-n{width:24px;height:24px;border:1.5px solid var(--lineS);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--fm);color:var(--mut)}
.stp.on{color:var(--ink)}
.stp.on .stp-n{background:var(--acc);border-color:var(--acc);color:#fff}
.stp.done{color:var(--ink);cursor:pointer}
.stp.done .stp-n{background:var(--ink);border-color:var(--ink);color:#F5F0E5}
.stp-ln{flex:1;max-width:90px;height:1px;background:var(--lineS);margin:0 14px}
.thome{max-width:1060px;margin:0 auto;padding:40px 28px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
.neword{background:var(--ink);color:#F5F0E5;border-radius:4px;padding:34px 32px;display:block;width:100%;text-align:left;border:0;transition:transform .16s}
.neword:hover{transform:translateY(-3px)}
.neword .nk{font:700 10px var(--fb);letter-spacing:.24em;color:#9B917F}
.neword .nt{font:800 clamp(30px,3.4vw,42px)/1.05 var(--fd);margin:14px 0 10px}
.neword .ns{font:500 13.5px;color:#B8AE9C;line-height:1.6;max-width:40ch}
.neword .nb{margin-top:24px;display:inline-flex;align-items:center;gap:10px;background:var(--acc);color:#fff;font:700 13px;padding:11px 18px;border-radius:2px}
.draftstrip{margin-top:14px;display:flex;align-items:center;gap:14px;border:1.5px dashed var(--acc);background:#FAEFE6;border-radius:3px;padding:14px 18px;flex-wrap:wrap}
.draftstrip b{font:700 14px var(--fd)}
.tside .h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1.5px solid var(--ink)}
.tside .h b{font:800 17px var(--fd)}
.todaynum{font:800 40px var(--fd);padding:14px 0 4px}
.todaynum small{font:600 12px var(--fb);color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin-left:8px}
.miniord{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.miniord:hover{background:#fff}
.cat{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 58px)}
.cside{border-right:1px solid var(--line);background:#EFEADC;padding:10px 0 30px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.cside .g{font:800 10.5px var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--mut);padding:16px 20px 7px}
.sit{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 20px;font:500 13px var(--fb);background:none;border:0;border-left:2.5px solid transparent;color:var(--ink2)}
.sit:hover{background:#E6E0D0}
.sit.on{border-left-color:var(--acc);background:#FBF8F0;font-weight:700;color:var(--ink)}
.sit .ct{font:500 10.5px var(--fm);color:var(--mut)}
.cmain{padding:0 26px 120px}
.ctop{position:sticky;top:58px;z-index:30;background:var(--paper);display:flex;align-items:center;gap:12px;padding:14px 0 12px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
.ctop .ti{font:800 20px var(--fd);white-space:nowrap}
.ctop .cnt{font:600 11px var(--fm);color:var(--mut);white-space:nowrap}
.ctop .sp{flex:1}
.srch{position:relative}
.srch input{padding:9px 12px 9px 34px;border:1px solid var(--lineS);background:#fff;border-radius:2px;font:500 13px var(--fb);width:220px;outline:0}
.srch .si{position:absolute;left:10px;top:9px;color:var(--mut)}
.fsel{padding:9px 10px;border:1px solid var(--lineS);background:#fff;border-radius:2px;font:600 12.5px var(--fb);max-width:150px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:14px;padding-top:18px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 12px 26px -16px rgba(27,23,18,.4)}
.tile .art{height:132px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--line)}
.tile .art svg{width:84%;height:auto}
.tile .art img{width:88%;height:88%;object-fit:contain}
.tile .plate{position:absolute;top:7px;left:9px;font:500 9px var(--fm);letter-spacing:.08em;color:rgba(27,23,18,.45);background:rgba(255,255,255,.7);padding:1px 5px;border-radius:2px}
.tile .oos{position:absolute;top:7px;right:9px;font:700 8.5px var(--fb);letter-spacing:.12em;color:var(--red);border:1px solid var(--red);padding:2px 6px;border-radius:2px;background:#fff}
.tile .quick{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:.16s}
.tile:hover .quick{opacity:1;transform:scale(1)}
.tile .quick:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.tinfo{padding:11px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.tbrand{font:700 9.5px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.tname{font:700 14px var(--fd)}
.tmeta{display:flex;align-items:center;gap:7px;font:500 10.5px var(--fm);color:var(--mut)}
.tmeta .dots{display:inline-flex;gap:3px}
.tmeta .dots i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(27,23,18,.25)}
.tprice{margin-top:auto;display:flex;align-items:baseline;gap:7px;padding-top:6px}
.tprice .r{font:700 15px var(--fm)}
.tprice s{font-size:11px}
.tprice .per{font:500 10px var(--fb);color:var(--mut)}
.tprice .st{margin-left:auto;font:600 10.5px var(--fm)}
.st.in{color:var(--grn)}.st.low{color:var(--amb)}.st.out{color:var(--red)}
.lmore{display:flex;justify-content:center;padding:22px 0 8px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:#F5F0E5;display:flex;align-items:center;gap:14px;padding:13px 26px;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.cartbar .cbl{display:flex;align-items:center;gap:12px;font:500 13.5px}
.cartbar .cbl b{font:800 15px var(--fd)}
.cartbar .sp{flex:1}
.drwovl{position:fixed;inset:0;background:rgba(23,19,14,.45);z-index:70;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(430px,96vw);background:var(--card);z-index:71;display:flex;flex-direction:column;animation:slide .22s}
@keyframes slide{from{transform:translateX(60px);opacity:0}}
.drw-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1.5px solid var(--ink)}
.drw-h b{font:800 19px var(--fd)}
.drw-body{flex:1;overflow:auto;padding:6px 20px}
.cl{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cl-art{width:66px;flex:none;border:1px solid var(--line);border-radius:3px;padding:5px;background:#fff;align-self:flex-start}
.cl-art svg{width:100%;height:auto}
.cl-art img{width:100%;height:52px;object-fit:contain;display:block}
.cl-n{font:700 13.5px var(--fd)}
.cl-v{font:500 11px var(--fm);color:var(--ink2);margin:3px 0 7px}
.cl-r{display:flex;align-items:center;gap:10px}
.stp2{display:inline-flex;align-items:center;border:1px solid var(--lineS);border-radius:2px;overflow:hidden}
.stp2 button{width:24px;height:24px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.stp2 span{min-width:30px;text-align:center;font:700 12px var(--fm)}
.cl-a{margin-left:auto;font:700 13px var(--fm)}
.drw-f{border-top:1.5px solid var(--ink);padding:16px 20px;background:var(--paper)}
.totrow{display:flex;justify-content:space-between;font:500 13px;padding:3px 0;color:var(--ink2)}
.totrow.big{font:800 17px var(--fd);color:var(--ink);border-top:1px solid var(--lineS);margin-top:8px;padding-top:10px}
.pd{display:grid;grid-template-columns:270px 1fr;gap:24px}
.pd-art{border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;min-height:230px}
.pd-art svg{width:92%;height:auto}
.pd-art img{max-width:100%;max-height:200px;object-fit:contain}
.pd-art .cap{font:500 10px var(--fm);color:var(--mut);margin-top:14px;letter-spacing:.08em}
.pd-b{font:700 10.5px var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.pd-n{font:800 24px/1.15 var(--fd);margin:6px 0 10px}
.pd-pr{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.pd-pr .r{font:800 26px var(--fm)}
.pd-pr .per{font:600 11px var(--fb);color:var(--mut)}
.pd-note{font:500 12px var(--fb);color:var(--ink2);margin-bottom:14px}
.margin-chip{display:inline-block;font:700 10.5px var(--fm);color:var(--grn);border:1px solid #9DBFA5;background:#E4EFE4;border-radius:2px;padding:3px 8px;margin-bottom:16px}
.lbl{font:700 10px var(--fb);letter-spacing:.15em;text-transform:uppercase;color:var(--ink2);margin:12px 0 8px}
.sw{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--lineS);background:#fff;border-radius:2px;padding:6px 11px 6px 7px;margin:0 8px 8px 0;font:600 12px var(--fb);cursor:pointer}
.sw i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(27,23,18,.25)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.szgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin-top:4px}
.sz{border:1.5px solid var(--lineS);border-radius:3px;padding:7px 3px 6px;text-align:center;background:#fff;cursor:pointer}
.sz.on{border-color:var(--acc);background:#FBEEE6;box-shadow:inset 0 0 0 1px var(--acc)}
.sz-n{font:800 15px var(--fd)}
.sz-q{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:5px;font:700 12px var(--fm);min-height:20px;color:var(--mut)}

function validateConfig(c){
  if(!c)throw new Error('Enter your Supabase project URL and publishable key.');
  var u;try{u=new URL(c.url)}catch(e){throw new Error('Enter the project URL, such as https://your-project.supabase.co');}
  if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash||u.pathname!=='/')throw new Error('Use the HTTPS project URL without an API path.');
  var k=String(c.publishableKey||'').trim();
  if(k.startsWith('sb_secret_'))throw new Error('Secret keys must never be used in this webpage. Use the publishable key.');
  if(!k.startsWith('sb_publishable_')){
    var claims;try{var part=k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');claims=JSON.parse(atob(part));}catch(e){}
    if(!claims||claims.role!=='anon')throw new Error('Use an sb_publishable_ key or the legacy anon key. Never use service_role.');
  }
  return {url:u.origin,publishableKey:k};
}
async function timedFetch(url,options){
  options=options||{};var controller=new AbortController();var signal=options.signal;
  function cancel(){controller.abort()}
  if(signal){if(signal.aborted)cancel();else signal.addEventListener('abort',cancel,{once:true})}
  var timeout=setTimeout(cancel,20000);
  try{return await fetch(url,Object.assign({},options,{signal:controller.signal}))}
  finally{clearTimeout(timeout);if(signal)signal.removeEventListener('abort',cancel)}
}

async function cloudInit(){

    SB=window.supabase.createClient(CLOUD_CFG.url,CLOUD_CFG.publishableKey,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false},global:{fetch:timedFetch}
    });
    SB.auth.onAuthStateChange(function(event,session){
      // Do not await Supabase calls inside this callback (Auth holds its lock).
      if(event==='INITIAL_SESSION')return;
      setTimeout(function(){
        if(!session){sessionEpoch++;cleanSession();S.view='gate';renderGate();return}
        if(SESSION&&SESSION.user.id===session.user.id){SESSION=session;return}
        connectSession(session);
      },0);
    });

    await connectSession(result.data.session);
  }catch(e){DB.phase='err';DB.lastErr=e.message;renderCloudScreen()}

async function connectSession(session){
  var epoch=++sessionEpoch;cleanSession();SESSION=session;
  if(!session){S.view='gate';renderGate();return}
  DB.phase='wait';renderCloudScreen();

    // A previous account's request may still be completing; never reuse its snapshot.
    if(refreshPromise)await refreshPromise.catch(function(){});
    if(epoch!==sessionEpoch)return;
    await refreshCloud();if(epoch!==sessionEpoch)return;
    try{PENDING=JSON.parse(sessionStorage.getItem(pendingKey())||'null')}catch(e){}
    S.view=PENDING?'term':'home';render();subscribeCloud();
  }catch(e){if(epoch!==sessionEpoch)return;DB.phase='err';DB.lastErr=e.message;renderCloudScreen()}
}
async function allRows(table,order){
  var rows=[],page=0;
  while(true){
    var r=await SB.from(table).select('*').order(order).range(page*500,page*500+499);
    if(r.error)throw r.error;rows=rows.concat(r.data||[]);
    if(!r.data||r.data.length<500)return rows;page++;
  }
}

async function refreshCloud(){
  if(!SB||!SESSION)return;
  if(refreshPromise)return refreshPromise;
  var epoch=sessionEpoch;
  refreshPromise=(async function(){
    try{
      var before=dataSig();
      var me=await SB.from('rider_members').select('*').eq('user_id',SESSION.user.id).maybeSingle();
      if(epoch!==sessionEpoch)return;
      if(me.error)throw me.error;
      if(!me.data||!me.data.active){
        S.products=[];S.orders=[];BMAP={};PROFILE=null;S.adminAuthed=false;DB.hasData=false;
        throw new Error('Your account needs an active rider_members entry. Ask the owner to approve this account.');
      }
      var results=await Promise.all([allRows('rider_products','sku'),allRows('rider_orders','id'),
        allRows('rider_members','display_name'),SB.from('rider_settings').select('*').eq('id',true).single()]);
      if(epoch!==sessionEpoch)return;
      if(results[3].error)throw results[3].error;
      PROFILE=me.data;S.adminAuthed=PROFILE.role==='admin';
      S.products=results[0].map(function(p){return Object.assign({},p.data,{sku:p.sku,stock:p.stock,version:p.version})});
      S.orders=results[1].map(function(o){return o.data});
      S.execs=results[2].filter(function(m){return m.active}).map(function(m){return m.display_name});
      GST_RATE=Number(results[3].data.gst_rate);GST_LBL=+(GST_RATE*100).toFixed(2)+'%';
      rebuildBmap();DB.online=true;DB.hasData=true;DB.phase='ready';DB.lastErr=null;
      if(S.view==='admin'&&!S.adminAuthed){closeModal();S.view='home';render()}
      else if(before!==dataSig()&&!S._booting)renderIfSafe();
      updateSyncDots();
    }catch(e){
      if(epoch===sessionEpoch){DB.online=false;DB.lastErr=e.message;updateSyncDots();
        if(!DB.hasData){DB.phase='err';renderCloudScreen()}}
      throw e;
    }
  })();
  try{return await refreshPromise}finally{refreshPromise=null}
}

function newRequestId(){
  if(crypto.randomUUID)return crypto.randomUUID();
  var a=crypto.getRandomValues(new Uint8Array(16));a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;
  return Array.from(a).map(function(b,i){return ([4,6,8,10].includes(i)?'-':'')+b.toString(16).padStart(2,'0')}).join('');

async function placeOrder(){
  if(submitBusy)return;
  var epoch=sessionEpoch;
  if(!PENDING){
    if(!S.term.cust||!S.term.lines.length)return;
    var c=JSON.parse(JSON.stringify(S.term.cust));
    if(S.term.pay){var t=Object.keys(TERMS).find(function(k){return TERMS[k]===S.term.pay});if(t)c.terms=t}
    PENDING={id:newRequestId(),payload:{cust:c,remarks:S.term.remarks,gst_rate:GST_RATE,
      lines:S.term.lines.map(function(l){return{sku:l.sku,color:l.color.n,sizes:l.sizes,rate:l.rate}})},draft:JSON.parse(JSON.stringify(S.term))};
    if(!savePending()){PENDING=null;toast('err','Browser session storage is unavailable. Enable it before submitting orders.');return}
  }
  submitBusy=true;renderTerm();
  try{
    var o=await rpc('rider_place_order',{p_request_id:PENDING.id,p_order:PENDING.payload});
    replaceOrder(o);PENDING=null;savePending();
    S.term={mode:'done',step:1,cust:null,lines:[],pay:'',remarks:'',lastId:o.id};
    DB.online=true;toast('ok','Order '+esc(o.no)+' saved to Supabase.');
  }catch(e){
    if(epoch!==sessionEpoch)return;
    // SQL validation errors roll the transaction back. Network errors may have
    // lost the response after COMMIT; retain the same UUID and frozen payload.
    if(e.code==='P0001'||['22P02','23514','22003'].includes(e.code)){
      S.term=PENDING.draft;PENDING=null;savePending();
      await refreshCloud().catch(function(){});
      S.term.lines.forEach(function(l){if(BMAP[l.sku])l.rate=BMAP[l.sku].price});
      toast('err',esc(e.message)+' Review the updated prices and quantities before retrying.');
    }else toast('err',esc(e.message||'Response not received.')+' Retry the same submission to check its result.');
  }finally{submitBusy=false;if(epoch===sessionEpoch){renderTerm();refreshCloud().catch(function(){})}}
}

function genProducts(){
  var out=[];
  GROUPS.forEach(function(G,gi){G.subs.forEach(function(sub,si){
    for(var i=0;i<PER_SUB;i++){
      var r=mulberry32(hash32(sub.code+'·'+i));
      var brand=pick(BRANDS,r),ser=pick(sub.ser,r),type=pick(sub.types,r),mat=pick(sub.mats,r);
      var cs=sub.cols.slice();
      for(var k=cs.length-1;k>0;k--){var j=(r()*(k+1))|0;var tmp=cs[k];cs[k]=cs[j];cs[j]=tmp}
      var colors=cs.slice(0,2+((r()*3)|0)).map(function(kk){return COLS[kk]});
      var sils=[].concat(sub.sil);
      var price=Math.round((sub.price[0]+r()*(sub.price[1]-sub.price[0]))/5)*5;
      var mrp=Math.round(price*(1.5+r()*0.45)/10)*10;
      var stock=r()<0.05?0:8+((r()*260)|0);
      out.push({sku:sub.code+'-'+(101+i),code:sub.code,group:G.g,sub:sub.name,
        brand:brand,name:ser+' '+type,mat:mat,colors:colors,sizes:sub.sizes.slice(),price:price,mrp:mrp,stock:stock,
        pack:pick(sub.pack,r),sil:sils[i%sils.length],image:null});
    }
  })});
  return out;
}
function mkLine(p,col,qty){var sizes={},pairs=0;
  Object.keys(qty).forEach(function(s){var q=qty[s];if(q>0){sizes[s]=q;pairs+=q}});
  return {key:p.sku+'|'+col.n,sku:p.sku,name:p.brand+' '+p.name,brand:p.brand,sil:p.sil,color:col,sizes:sizes,pairs:pairs,rate:p.price,pack:p.pack}}
function totalsOf(lines){var sub=0,pairs=0;
  lines.forEach(function(l){sub+=l.pairs*l.rate;pairs+=l.pairs});
  var gst=Math.round(sub*GST_RATE);return {pairs:pairs,sub:sub,gst:gst,total:sub+gst}}

  function bad(id,msg){var f=$('#f-'+id);if(!f)return;f.classList.add('bad');var er=f.querySelector('.err');if(er)er.textContent=msg;ok=false}
  if(d.name.length<3)bad('c-name','Enter the owner\u2019s name');
  if(d.shop.length<3)bad('c-shop','Enter the shop name');
  if(!/^[6-9]\d{9}$/.test(d.mobile))bad('c-mobile','Enter a valid 10-digit mobile');
  if(!d.city)bad('c-city','Required');
  if(d.gst&&!/^[0-9A-Z]{15}$/.test(d.gst))bad('c-gst','GSTIN must be 15 characters');
  if(d.bank&&d.bank.ifsc&&!/^[A-Za-z]{4}0[A-Za-z0-9]{6}$/.test(d.bank.ifsc))bad('c-ifsc','Invalid IFSC');
  if(!ok){var b=$('.field.bad');if(b)b.scrollIntoView({behavior:'smooth',block:'center'});return}
  S.term.cust=d;S.term.step=2;S.term.mode='cat';
  if(!S.term.lines.length){S.cat='0-0';S.q='';S.brand='all';S.page=1}
  renderTerm();toast('ok','Retailer saved — catalogue open');
}

/* ----- catalog ----- */
function scopeProducts(key){
  var parts=key.split('-'),G=GROUPS[+parts[0]],si=parts[1];
  return S.products.filter(function(p){return p.group===G.g&&(si==='all'||p.sub===G.subs[+si].name)});
}
function scopeLabel(key){
  var parts=key.split('-'),G=GROUPS[+parts[0]];
  return parts[1]==='all'?'All '+G.g:G.subs[+parts[1]].name;
}
function curProducts(){
  var list=scopeProducts(S.cat);
  if(S.q){var q=S.q.toLowerCase();list=list.filter(function(p){return (p.brand+' '+p.name+' '+p.mat+' '+p.sku).toLowerCase().indexOf(q)>-1})}
  if(S.brand!=='all')list=list.filter(function(p){return p.brand===S.brand});
  if(S.sort==='plow')list=list.slice().sort(function(a,b){return a.price-b.price});
  if(S.sort==='phigh')list=list.slice().sort(function(a,b){return b.price-a.price});
  if(S.sort==='name')list=list.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  return list;
}
function tile(p){
  var col=p.colors[0];

    '<div class="art">'+prodArt(p)+

    (p.stock===0?'<span class="oos">OUT OF STOCK</span>':'')+

    '</div><div class="tinfo">'+
    '<div class="tbrand">'+esc(p.brand)+' · '+esc(p.mat)+'</div>'+
    '<div class="tname">'+esc(p.name)+'</div>'+
    '<div class="tmeta"><span class="dots">'+p.colors.map(function(c){return '<i style="background:'+c.h+'" title="'+esc(c.n)+'"></i>'}).join('')+'</span> '+p.sizes[0]+'\u2013'+p.sizes[p.sizes.length-1]+' UK</div>'+
    '<div class="tprice"><span class="r">₹'+p.price+'</span><s>₹'+p.mrp+'</s><span class="per">/pair</span>'+stLabel(p)+'</div>'+
    '</div></div>';
}
function termCat(){
  var side='';

    side+='<div class="g">'+G.g+'</div>';
    var ak=gi+'-all';
    side+='<button class="sit '+(S.cat===ak?'on':'')+'" onclick="setSub(\''+ak+'\')"><span>All '+G.g+'</span><span class="ct">'+scopeProducts(ak).length+'</span></button>';
    G.subs.forEach(function(s2,si){var k=gi+'-'+si;
      side+='<button class="sit '+(S.cat===k?'on':'')+'" onclick="setSub(\''+k+'\')"><span>'+s2.name+'</span><span class="ct">'+scopeProducts(k).length+'</span></button>'});
  });

  var brands=[];scopeProducts(S.cat).forEach(function(p){if(brands.indexOf(p.brand)<0)brands.push(p.brand)});brands.sort();

    '<div class="ctop"><span class="ti">'+scopeLabel(S.cat)+'</span><span class="cnt">'+list.length+' STYLES</span><span class="sp"></span>'+

    '<select class="fsel" onchange="catBrand(this.value)"><option value="all">All brands</option>'+brands.map(function(b){return '<option '+(S.brand===b?'selected':'')+'>'+esc(b)+'</option>'}).join('')+'</select>'+

    '<option value="plow" '+(S.sort==='plow'?'selected':'')+'>Rate low \u2192 high</option>'+
    '<option value="phigh" '+(S.sort==='phigh'?'selected':'')+'>Rate high \u2192 low</option>'+
    '<option value="name" '+(S.sort==='name'?'selected':'')+'>Name A\u2013Z</option></select></div>'+
    '<div id="pgrid" class="pgrid">'+(shown.map(tile).join('')||'<div class="empty" style="grid-column:1/-1">'+ic('search',28)+'<b>No styles match</b>Try another search or category.</div>')+'</div>'+
    (shown.length<list.length?'<div class="lmore"><button class="btn ghost" onclick="S.page++;renderTerm()">Load more ('+(list.length-shown.length)+' left) '+ic('down',14)+'</button></div>':'')+

}
function setSub(k){S.cat=k;S.q='';S.brand='all';S.page=1;renderTerm()}
function catSearch(v){S.q=v;S.page=1;
  var list=curProducts(),shown=list.slice(0,S.page*36);
  var el=$('#pgrid');if(el)el.innerHTML=shown.map(tile).join('')||'<div class="empty" style="grid-column:1/-1">'+ic('search',28)+'<b>No styles match</b>Try another search.</div>';}
function catSort(v){S.sort=v;S.page=1;renderTerm()}
function catBrand(v){S.brand=v;S.page=1;renderTerm()}
function cartBar(){
  var L2=S.term.lines;if(!L2.length)return'';
  var pairs=0,sub=0;L2.forEach(function(l){pairs+=l.pairs;sub+=l.pairs*l.rate});
  return '<div class="cartbar"><div class="cbl">'+ic('bag',20)+'<b>'+L2.length+' line'+(L2.length>1?'s':'')+'</b><span style="color:#B8AE9C">· '+pairs+' pairs · '+fmoney(sub)+' + GST</span></div>'+
    '<span class="sp"></span><button class="btn acc" onclick="openCart()">Review order '+ic('right',15)+'</button></div>';
}
function quickAdd(sku){
  var p=BMAP[sku];if(!p)return;
  var avail=availFor(p);
  if(!avail){toast('warn','Out of stock');return}
  var ss=p.sizes,m=ss.length>>1,take=[ss[m-1],ss[m],ss[m+1]].filter(function(x){return !!x});
  var qty={};take.forEach(function(s){if(avail<=0)return;var q=Math.min(2,avail);qty[s]=q;avail-=q});
  var line=mkLine(p,p.colors[0],qty);mergeLine(line);
  renderTerm();toast('ok',line.pairs+' pairs added — '+esc(p.brand)+' '+esc(p.name));
}
function mergeLine(line){
  var ex=null;S.term.lines.forEach(function(l){if(l.key===line.key)ex=l});
  if(ex){Object.keys(line.sizes).forEach(function(s){ex.sizes[s]=(ex.sizes[s]||0)+line.sizes[s]});
    ex.pairs=Object.keys(ex.sizes).reduce(function(a,s){return a+ex.sizes[s]},0)}
  else S.term.lines.push(line);
}

function pdColor(i){

function pq(s,d){
  var p=BMAP[S.pd.sku];if(!p)return;
  var q=(S.pd.qty[s]||0)+d,tot=0;
  Object.keys(S.pd.qty).forEach(function(k){tot+=S.pd.qty[k]});
  if(d>0&&tot>=availFor(p)){toast('warn','Only '+availFor(p)+' pairs left in stock');return}
  S.pd.qty[s]=Math.max(0,q);pdSync();
}
function szRun(n){
  var p=BMAP[S.pd.sku];if(!p)return;
  if(n>0&&p.sizes.length*n>availFor(p)){toast('warn','Only '+availFor(p)+' pairs in stock — reduce sizes');return}
  S.pd.qty={};if(n>0)p.sizes.forEach(function(s){S.pd.qty[s]=n});pdSync();
}
function pdSync(){
  var p=BMAP[S.pd.sku];if(!p)return;
  var pairs=0;
  p.sizes.forEach(function(s){
    var q=S.pd.qty[s]||0;pairs+=q;
    var cell=$('#sz-'+s),qv=$('#qv-'+s);
    if(!cell)return;
    qv.textContent=q||'\u2013';cell.classList.toggle('on',q>0);
  });
  $('#pdPairs').textContent=pairs;$('#pdAmt').textContent=fmoney(pairs*p.price);
  $('#pdAdd').disabled=!pairs;
}
function addToOrder(){
  var p=BMAP[S.pd.sku];if(!p)return;

  var line=mkLine(p,col,S.pd.qty);
  mergeLine(line);closeModal();renderTerm();
  toast('ok',line.pairs+' pairs · '+esc(col.n)+' — added to order');
}

function clQty(i,d){
  var l=S.term.lines[i];if(!l)return;
  var p=BMAP[l.sku],np=l.pairs+d;
  if(np<1)return;
  if(p){
    var others=0;S.term.lines.forEach(function(x,xi){if(xi!==i&&x.sku===l.sku)others+=x.pairs});
    if(np+others>p.stock){toast('warn','Only '+(p.stock-others)+' pairs in stock');return}
  }
  var f=np/l.pairs,es=[],acc=0,ns={};
  Object.keys(l.sizes).forEach(function(s){if(l.sizes[s]>0)es.push([s,l.sizes[s]])});
  es.forEach(function(e,idx){
    if(idx===es.length-1)ns[e[0]]=Math.max(1,np-acc);
    else{var vv=Math.max(0,Math.round(e[1]*f));ns[e[0]]=vv;acc+=vv}
  });
  l.sizes=ns;l.pairs=np;openCart();renderTerm();
}

function chart14(){
  var days=[],now=new Date();now.setHours(0,0,0,0);
  for(var i=13;i>=0;i--)days.push({t:now.getTime()-i*864e5,v:0,n:0});
  S.orders.forEach(function(o){var d=new Date(o.ts);d.setHours(0,0,0,0);
    days.forEach(function(x){if(x.t===d.getTime()&&o.status!=='cancelled'){x.v+=o.total;x.n++}})});
  var mx=1;days.forEach(function(d){if(d.v>mx)mx=d.v});
  var W=620,H=168,pad=8,bw=(W-pad*2)/14,svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">';
  days.forEach(function(d,i){
    var h=Math.max(d.v>0?4:1.5,(d.v/mx)*108),x=pad+i*bw+5,y=118-h;
    var dd=new Date(d.t);
    svg+='<rect x="'+x+'" y="'+y+'" width="'+(bw-11)+'" height="'+h+'" rx="2" fill="'+(i===13?'var(--acc)':'var(--ink)')+'" opacity="'+(i===13?1:.82)+'"><title>'+dd.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+fmoney(d.v)+' · '+d.n+' order(s)</title></rect>';
    if(i%2===1)svg+='<text x="'+(x+(bw-11)/2)+'" y="136" text-anchor="middle" font-family="Spline Sans Mono,monospace" font-size="9" fill="var(--mut)">'+dd.getDate()+'/'+(dd.getMonth()+1)+'</text>';
  });
  svg+='<line x1="'+pad+'" y1="118" x2="'+(W-pad)+'" y2="118" stroke="var(--ink)" stroke-width="1.5"/></svg>';
  return svg;
}

/* ----- image picker (gallery / camera) ----- */
function pickImage(cb){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        var M=800,r=Math.min(1,M/Math.max(img.width,img.height));
        var cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.width*r));cv.height=Math.max(1,Math.round(img.height*r));
        var cx=cv.getContext('2d');
        cx.fillStyle='#FFFFFF';cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img,0,0,cv.width,cv.height);
        var url=cv.toDataURL('image/jpeg',0.72);
        cb(url,Math.max(1,Math.round(url.length*3/4/1024)));
      };
      img.onerror=function(){toast('err','Could not read that image')};
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function imgWidgetHTML(img,idPrefix){
  return '<div class="imgbox" id="'+idPrefix+'-box">'+
    (img?'<img src="'+esc(img)+'">':'<span class="kick" style="padding:24px 10px">NO PHOTO · SILHOUETTE WILL SHOW</span>')+
    '</div><div class="imgbtns">'+
    '<button type="button" class="btn ghost sm" onclick="pickImage(function(url,kb){setImg(\''+idPrefix+'\',url);toast(\'ok\',\'Photo added (\'+kb+\' KB, auto-compressed)\')})">'+ic('camera',14)+' Add photo from gallery</button>'+
    (img?'<button type="button" class="btn ghost sm" onclick="setImg(\''+idPrefix+'\',null)">Remove photo</button>':'')+
    '</div>';
}
var IMGSTORE={};
function setImg(idPrefix,url){

    (url?'<button type="button" class="btn ghost sm" onclick="setImg(\''+idPrefix+'\',null)">Remove photo</button>':'')+

/* ----- edit style ----- */

    '<div class="mb">'+
    '<div class="kick" style="margin-bottom:14px">'+p.sku+' · '+esc(p.sub).toUpperCase()+' · '+p.colors.map(function(c){return esc(c.n)}).join(', ')+'</div>'+
    '<div style="max-width:280px">'+imgWidgetHTML(p.image||null,'ed')+'</div>'+
    '<div class="fgrid" style="margin-top:16px">'+
    '<div class="field"><label>Brand</label><input id="e-brand" value="'+esc(p.brand)+'"></div>'+
    '<div class="field"><label>Style name</label><input id="e-name" value="'+esc(p.name)+'"></div></div>'+
    '<div class="fgrid">'+

    '<div class="field"><label>Carton pack (pairs)</label><input id="e-pack" type="number" value="'+p.pack+'"></div></div>'+

    '<div class="field"><label>MRP ₹</label><input id="e-mrp" type="number" value="'+p.mrp+'"></div></div>'+

    '<button class="btn acc" onclick="invSave(\''+p.sku+'\')">'+ic('check',14)+' Save changes</button></div></div></div>';

async function invSave(sku){
  if(!ED||ED.sku!==sku)return;
  var p=JSON.parse(JSON.stringify(ED.product)),version=ED.version;
  function g(id){return $('#'+id).value.trim()}
  p.brand=g('e-brand');p.name=g('e-name');p.mat=g('e-mat');p.pack=+g('e-pack');
  p.price=+g('e-price');p.mrp=+g('e-mrp');p.stock=+g('e-stock');p.image=IMGSTORE.ed||null;
  if(!Number.isInteger(p.stock)||p.stock<0||!Number.isInteger(p.pack)||p.pack<1||p.price<=0||p.mrp<p.price){
    toast('err','Check stock, carton size and prices.');return
  }
  var ok=await mutate(async function(){replaceProduct(await rpc('rider_save_product',{p_product:p,p_expected_version:version}));},'Product saved.');
  if(ok){closeModal();refreshCurrentAdminTab()}
}
function askDeleteSku(sku){
  var p=BMAP[sku];if(!p)return;
  $('#modal').innerHTML='<div class="ovl" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(430px,94vw)">'+
    '<div class="mb" style="text-align:center;padding:30px 26px">'+
    '<span style="color:var(--red)">'+ic('alert',34)+'</span>'+
    '<h3 style="font:800 21px var(--fd);margin:12px 0 6px">Delete '+p.sku+'?</h3>'+
    '<p style="font:500 13px var(--fb);color:var(--ink2);margin-bottom:6px">'+esc(p.brand)+' '+esc(p.name)+' · '+p.stock+' pairs in stock</p>'+
    '<p style="font:500 12px var(--fb);color:var(--mut);margin-bottom:22px">Archives this style from the catalogue. Past orders keep their records. The original SKU stays reserved.</p>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
    '<button class="btn ghost" onclick="closeModal()">Keep style</button>'+
    '<button class="btn danger" onclick="deleteSku(\''+sku+'\')">'+ic('trash',14)+' Archive style</button>'+
    '</div></div></div></div>';
}
async function deleteSku(sku){
  var p=BMAP[sku];if(!p)return;
  var ok=await mutate(async function(){await rpc('rider_archive_product',{p_sku:sku,p_expected_version:p.version});
    S.products=S.products.filter(function(x){return x.sku!==sku});rebuildBmap();},'Style archived.');
  if(ok){closeModal();refreshCurrentAdminTab()}
}
/* ----- add new style ----- */

function openAddProd(){

    '<div class="mh"><b>Add new style</b><span class="kick">LIVE ON EVERY DEVICE INSTANTLY</span><button class="iconbtn x" onclick="closeModal()">'+ic('x',16)+'</button></div>'+
    '<div class="mb"><div class="pd">'+
    '<div><div class="pd-art" id="afArt"></div><div class="kick mono" id="afSku" style="margin-top:10px;text-align:center"></div>'+
    '<div style="margin-top:12px">'+imgWidgetHTML(null,'af')+'</div></div>'+
    '<div>'+
    '<div class="fgrid">'+
    '<div class="field"><label>Division</label><select id="af-div" onchange="afDiv()"></select></div>'+

function afFillDiv(){
  $('#af-div').innerHTML=GROUPS.map(function(g,i){return '<option value="'+i+'" '+(i===AF.div?'selected':'')+'>'+g.g+'</option>'}).join('');
  afFillCat();
}
function afDiv(){AF.div=+$('#af-div').value;AF.cat=0;AF.sizes={};afFillCat()}
function afFillCat(){
  var subs=GROUPS[AF.div].subs;
  $('#af-cat').innerHTML=subs.map(function(s2,i){return '<option value="'+i+'" '+(i===AF.cat?'selected':'')+'>'+s2.name+'</option>'}).join('');
  afCat();
}
function afCat(){
  AF.cat=+$('#af-cat').value;
  var sub=GROUPS[AF.div].subs[AF.cat];
  Object.keys(AF.sizes).forEach(function(s){if(sub.sizes.indexOf(s)<0)delete AF.sizes[s]});
  afColChips();afSizeChips();afPreview();
}
function afColChips(){
  $('#afCols').innerHTML=Object.keys(COLS).map(function(k){var c=COLS[k];
    return '<button type="button" class="sw '+(AF.cols[k]?'on':'')+'" onclick="afTogCol(\''+k+'\')"><i style="background:'+c.h+'"></i>'+esc(c.n)+'</button>'}).join('');
}
function afTogCol(k){AF.cols[k]=!AF.cols[k];afColChips();afPreview()}
function afSizeChips(){
  var sub=GROUPS[AF.div].subs[AF.cat];
  $('#afSizes').innerHTML=sub.sizes.map(function(s){
    return '<div class="sz '+(AF.sizes[s]?'on':'')+'" onclick="afTogSize(\''+s+'\')"><div class="sz-n">'+s+'</div><div class="sz-q">'+(AF.sizes[s]?'\u2713':'&nbsp;')+'</div></div>'}).join('');
}
function afTogSize(s){AF.sizes[s]=!AF.sizes[s];afSizeChips()}
function afPreview(){
  var sub=GROUPS[AF.div].subs[AF.cat];
  var sils=[].concat(sub.sil),sil=sils[0];
  var a=$('#afArt');if(!a)return;
  var img=IMGSTORE['af'];
  if(img){a.style.background='#fff';a.innerHTML='<img src="'+esc(img)+'"><span class="cap">PRODUCT PHOTO</span>'}
  else{
    var hex='#B98A5A';
    var fk=Object.keys(AF.cols).filter(function(k){return AF.cols[k]});
    if(fk.length)hex=COLS[fk[0]].h;
    a.style.background=tintOf(hex);
    a.innerHTML=art(sil,hex)+'<span class="cap">PREVIEW · '+sil.toUpperCase()+'</span>';
  }
  $('#afSku').textContent='AUTO SKU · '+nextSku(sub.code);
}
var _origSetImg=setImg;
setImg=function(idPrefix,url){
  _origSetImg(idPrefix,url);
  if(idPrefix==='af'&&AF)afPreview();
};
async function saveNewProd(){
  var sub=GROUPS[AF.div].subs[AF.cat];
  function g(id){var el=$('#'+id);return el?el.value.trim():''}
  ['af-brand','af-name','af-price'].forEach(function(id){var el=$('#'+id);if(el)el.style.borderColor=''});
  var brand=g('af-brand'),name=g('af-name'),mat=g('af-mat')||sub.mats[0];
  var price=+g('af-price'),mrp=+g('af-mrp'),pack=+g('af-pack')||sub.pack[0],stock=Math.max(0,Math.round(+g('af-stock')||0));
  var colKeys=Object.keys(AF.cols).filter(function(k){return AF.cols[k]});
  var sizeKeys=Object.keys(AF.sizes).filter(function(k){return AF.sizes[k]});
  function bad(id,msg){var el=$('#'+id);if(el)el.style.borderColor='var(--red)';toast('err',msg)}
  if(brand.length<2)return bad('af-brand','Enter a brand name');
  if(name.length<2)return bad('af-name','Enter a style name');
  if(!colKeys.length){toast('err','Pick at least one colour');return}
  if(!sizeKeys.length){toast('err','Pick at least one size');return}
  if(!(price>0))return bad('af-price','Enter a valid wholesale rate');
  var mrpF=mrp>0?Math.max(mrp,price):Math.round(price*1.8);
  var sku=AF.sku||(AF.sku=nextSku(sub.code));
  var sils=[].concat(sub.sil);
  var p={sku:sku,code:sub.code,group:GROUPS[AF.div].g,sub:sub.name,brand:brand,name:name,
    mat:mat,colors:colKeys.map(function(k){return COLS[k]}),sizes:sizeKeys.slice(),
    price:price,mrp:mrpF,stock:stock,pack:pack,sil:sils[0],image:IMGSTORE['af']||null};
  var ok=await mutate(async function(){replaceProduct(await rpc('rider_save_product',{p_product:p,p_expected_version:null}));},'Product added.');
  if(ok){closeModal();refreshCurrentAdminTab()}
}

/* ----- admin customers ----- */
function admCustomers(){
  $('#admView').innerHTML='<div class="ahead"><h2>Retailers</h2><span class="sub">Every shop your team has booked, with ledgers</span></div>'+
    '<div id="custStats"></div>'+
    '<div class="fbar"><div class="srch"><span class="si">'+ic('search',15)+'</span><input placeholder="Search shop, owner, city, GST…" value="'+esc(S.custQ)+'" oninput="S.custQ=this.value;custBody()"></div></div>'+
    '<div id="custList"></div>';
  custStats();custBody();
}
function custMap(){
  var map={};
  S.orders.forEach(function(o){
    var k=o.cust.mobile;
    if(!map[k])map[k]={c:o.cust,orders:[],val:0,pairs:0,last:0};
    var m=map[k];m.orders.push(o);
    if(o.status!=='cancelled')m.val+=o.total;
    m.pairs+=o.pairs;m.last=Math.max(m.last,o.ts);
  });
  return map;
}
function custStats(){
  var map=custMap(),totV=0,nCredit=0;
  Object.keys(map).forEach(function(k){totV+=map[k].val;if((map[k].c.terms||'').indexOf('credit')===0)nCredit++});
  var el=$('#custStats');if(!el)return;
  el.innerHTML='<div class="statstrip">'+
    '<div class="stat"><span>Retailers</span><b>'+Object.keys(map).length+'</b></div>'+
    '<div class="stat"><span>Lifetime book</span><b>'+flakh(totV)+'</b></div>'+
    '<div class="stat"><span>On credit terms</span><b>'+nCredit+'</b></div></div>';
}
function custBody(){
  var map=custMap();
  var list=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.val-a.val});
  if(S.custQ){var q=S.custQ.toLowerCase();list=list.filter(function(m){return (m.c.shop+' '+m.c.name+' '+m.c.city+' '+(m.c.gst||'')).toLowerCase().indexOf(q)>-1})}
  var el=$('#custList');if(!el)return;

    list.map(function(m){return '<tr class="click" onclick="custOpen(\''+m.c.mobile+'\')">'+
    '<td><b style="font:700 13px var(--fd)">'+esc(m.c.shop)+'</b>'+(m.c.gst?'<br><span style="font-size:10.5px;color:var(--mut)" class="mono">'+esc(m.c.gst)+'</span>':'')+'</td>'+
    '<td>'+esc(m.c.name)+'</td><td class="mono" style="font-size:12px">'+esc(m.c.mobile)+'</td>'+
    '<td style="font-size:12.5px">'+esc(m.c.city)+(m.c.area?', '+esc(m.c.area):'')+'</td>'+

    '<td class="num">'+m.orders.length+'</td><td class="num">'+m.pairs+'</td>'+
    '<td class="num"><b>'+fmoney(m.val)+'</b></td><td style="font-size:12px;white-space:nowrap">'+(m.last?fdate(m.last):'\u2014')+'</td></tr>'}).join('')+
    '</tbody></table></div>';
}
function custOpen(mobile){
  var list=S.orders.filter(function(o){return o.cust.mobile===mobile}).sort(function(a,b){return b.ts-a.ts});

    (c.gst?'<div><span>GSTIN</span><b class="mono" style="font-size:11.5px">'+esc(c.gst)+'</b></div>':'')+
    (c.limit?'<div><span>Credit limit</span><b>'+fmoney(+c.limit)+'</b></div>':'')+
    '</div>'+bankBlock(c.bank)+
